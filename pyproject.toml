[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "halp-cli"
version = "0.2.0"
description = "Generate grounded shell commands from natural-language tasks using an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.scripts]
halp = "halp:main"

[tool.setuptools]
py-modules = ["halp"]
